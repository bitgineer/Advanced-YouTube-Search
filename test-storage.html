<!DOCTYPE html>
<html>
<head>
    <title>Test Search History Storage</title>
</head>
<body>
    <h1>Search History Storage Test</h1>
    <div id="output"></div>

    <script>
        // LocalStorage helper functions for search history
        const SearchHistoryStorage = {
            STORAGE_KEY: 'ytAdvancedSearchHistory',
            MAX_ITEMS: 50,

            getHistory: function() {
                try {
                    const data = localStorage.getItem(this.STORAGE_KEY);
                    return data ? JSON.parse(data) : [];
                } catch (error) {
                    return [];
                }
            },

            addToHistory: function(searchParams) {
                try {
                    const history = this.getHistory();
                    const newEntry = {
                        id: Date.now().toString(),
                        timestamp: new Date().toISOString(),
                        params: searchParams
                    };

                    history.unshift(newEntry);

                    if (history.length > this.MAX_ITEMS) {
                        history.splice(this.MAX_ITEMS);
                    }

                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(history));
                    return newEntry.id;
                } catch (error) {
                    return null;
                }
            },

            removeFromHistory: function(id) {
                try {
                    const history = this.getHistory();
                    const filtered = history.filter(item => item.id !== id);
                    localStorage.setItem(this.STORAGE_KEY, JSON.stringify(filtered));
                    return true;
                } catch (error) {
                    return false;
                }
            },

            clearHistory: function() {
                try {
                    localStorage.removeItem(this.STORAGE_KEY);
                    return true;
                } catch (error) {
                    return false;
                }
            }
        };

        // Run tests
        const output = document.getElementById('output');

        function log(message) {
            output.innerHTML += '<p>' + message + '</p>';
        }

        // Test 1: Clear any existing history
        log('<strong>Test 1: Clear existing history</strong>');
        SearchHistoryStorage.clearHistory();
        const history1 = SearchHistoryStorage.getHistory();
        log('✓ History cleared. Count: ' + history1.length);

        // Test 2: Add search entries
        log('<br><strong>Test 2: Add 3 search entries</strong>');
        const id1 = SearchHistoryStorage.addToHistory({
            regularSearch: 'test search 1',
            exactTerm: 'exact',
            videoLength: 'short'
        });
        log('✓ Added entry 1. ID: ' + id1);

        const id2 = SearchHistoryStorage.addToHistory({
            regularSearch: 'test search 2',
            excludeTerms: 'spam',
            videoLength: 'medium'
        });
        log('✓ Added entry 2. ID: ' + id2);

        const id3 = SearchHistoryStorage.addToHistory({
            regularSearch: 'test search 3',
            titleIncludes: 'tutorial',
            dateAfter: '2024-01-01'
        });
        log('✓ Added entry 3. ID: ' + id3);

        const history2 = SearchHistoryStorage.getHistory();
        log('✓ Total entries: ' + history2.length);

        // Test 3: Verify entries have correct structure
        log('<br><strong>Test 3: Verify entry structure</strong>');
        if (history2[0]) {
            log('✓ First entry has id: ' + ('id' in history2[0]));
            log('✓ First entry has timestamp: ' + ('timestamp' in history2[0]));
            log('✓ First entry has params: ' + ('params' in history2[0]));
            log('✓ Timestamp format: ' + history2[0].timestamp);
        }

        // Test 4: Remove specific entry
        log('<br><strong>Test 4: Remove middle entry</strong>');
        SearchHistoryStorage.removeFromHistory(id2);
        const history3 = SearchHistoryStorage.getHistory();
        log('✓ After removing entry ' + id2 + ', count: ' + history3.length);

        // Test 5: FIFO limit test (add 55 items, verify only 50 remain)
        log('<br><strong>Test 5: Test 50-item limit with FIFO eviction</strong>');
        for (let i = 0; i < 55; i++) {
            SearchHistoryStorage.addToHistory({
                regularSearch: 'auto test ' + i
            });
        }
        const history4 = SearchHistoryStorage.getHistory();
        log('✓ Added 55 entries. Total count: ' + history4.length);
        log('✓ FIFO limit enforced: ' + (history4.length === 50 ? 'PASS' : 'FAIL'));

        // Cleanup
        log('<br><strong>Cleanup: Clearing test data</strong>');
        SearchHistoryStorage.clearHistory();
        const history5 = SearchHistoryStorage.getHistory();
        log('✓ Final count: ' + history5.length);

        log('<br><strong>All tests completed! Check console for localStorage.</strong>');
        console.log('Final localStorage state:', localStorage.getItem('ytAdvancedSearchHistory'));
    </script>
</body>
</html>
