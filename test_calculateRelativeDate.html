<!DOCTYPE html>
<html>
<head>
    <title>Test calculateRelativeDate Function</title>
</head>
<body>
    <h1>Test Results for calculateRelativeDate Function</h1>
    <div id="results"></div>

    <script>
        // Helper function to calculate relative dates for presets
        function calculateRelativeDate(daysAgo = 0, hoursAgo = 0) {
            const date = new Date();
            date.setDate(date.getDate() - daysAgo);
            date.setHours(date.getHours() - hoursAgo);
            return date.toISOString().split('T')[0];
        }

        // Test and display results
        const results = document.getElementById('results');
        let output = '';

        output += '<h2>Test 1: calculateRelativeDate(1) - Should return yesterday</h2>';
        const yesterday = calculateRelativeDate(1);
        output += '<p>Result: <strong>' + yesterday + '</strong></p>';
        output += '<p>Format valid (YYYY-MM-DD): ' + (/^\d{4}-\d{2}-\d{2}$/.test(yesterday) ? '✓ YES' : '✗ NO') + '</p>';

        const today = new Date();
        const expectedYesterday = new Date(today);
        expectedYesterday.setDate(today.getDate() - 1);
        const expectedYesterdayStr = expectedYesterday.toISOString().split('T')[0];
        output += '<p>Correct date: ' + (yesterday === expectedYesterdayStr ? '✓ YES' : '✗ NO') + '</p>';
        output += '<p>Expected: ' + expectedYesterdayStr + '</p>';

        output += '<hr>';

        output += '<h2>Test 2: calculateRelativeDate(0, 1) - Should return today</h2>';
        const todayResult = calculateRelativeDate(0, 1);
        output += '<p>Result: <strong>' + todayResult + '</strong></p>';
        output += '<p>Format valid (YYYY-MM-DD): ' + (/^\d{4}-\d{2}-\d{2}$/.test(todayResult) ? '✓ YES' : '✗ NO') + '</p>';

        const todayStr = today.toISOString().split('T')[0];
        output += '<p>Correct date: ' + (todayResult === todayStr ? '✓ YES' : '✗ NO') + '</p>';
        output += '<p>Expected: ' + todayStr + '</p>';

        output += '<hr>';

        output += '<h2>Additional Tests</h2>';
        output += '<p>calculateRelativeDate(0): ' + calculateRelativeDate(0) + '</p>';
        output += '<p>calculateRelativeDate(7): ' + calculateRelativeDate(7) + '</p>';
        output += '<p>calculateRelativeDate(30): ' + calculateRelativeDate(30) + '</p>';

        results.innerHTML = output;
    </script>
</body>
</html>
